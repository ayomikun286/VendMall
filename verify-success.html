<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>

<body
  style="background-color: #EDF2F7; display: flex;
justify-content: center;
align-items: center;
flex-direction: column;
gap: 15px;
color: #576375; font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;">

    <div style="display: flex; justify-content: center;">
      <a href="${url}"><button
