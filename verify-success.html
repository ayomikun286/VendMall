<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
     <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src http://localhost:5000 http://127.0.0.1:5500; script-src 'self'; style-src 'self';">
    <title>Document</title>
  </head>
  <body>
    <script>
      const params = new URLSearchParams(window.location.search);
      const token = params.get("token");

      if (token) {
        localStorage.setItem("token", token);
        alert('i got the token')

        // Remove token from URL
        window.history.replaceState(
          {},
          document.title,
          window.location.pathname,
        );

        console.log("Token from URL:", token);
localStorage.setItem("token", token);
console.log("Token in localStorage:", localStorage.getItem("token"));


        // Redirect to dashboard
        window.location.href = "http://127.0.0.1:5500/vendorDash/index.html";
      } else {
        document.body.innerHTML = "<h2>Verification failed</h2>";
      }
    </script>
  </body>
</html>
